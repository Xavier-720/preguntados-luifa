spring:
  datasource:
    url: jdbc:h2:mem:preguntados-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

app:
  admin-pin: test-pin
  timezone: America/Argentina/Buenos_Aires
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.hibernate: WARN
    org.flywaydb: WARN
