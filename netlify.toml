# Netlify sirve la SPA y ejecuta la API serverless bajo /api/v1.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# React Router resuelve /admin y el resto de las rutas en el cliente.
# Las funciones con config.path se resuelven antes que este fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
