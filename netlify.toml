# Netlify: el frontend vive en /frontend y habla con la API por VITE_API_URL.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# React Router resuelve /admin y el resto de las rutas en el cliente.
# VITE_API_URL debe apuntar al backend público: /api no se proxya desde acá.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
